[package]
name = "lokomotiv"
version = "20260603.0.0"
edition = "2021"
rust-version = "1.80"
description = "Local orchestration layer for coordinating multiple LLM backends"
authors = ["ducks"]
license = "MIT"
repository = "https://github.com/maxkulish/lok"
homepage = "https://github.com/maxkulish/lok"
documentation = "https://docs.rs/lokomotiv"

readme = "README.md"
keywords = ["llm", "ai", "orchestration", "codex", "gemini"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
    ".bundle/",
    ".gems/",
    ".npm-global/",
    "log/",
    "tmp/",
    "target/",
]

[[bin]]
name = "lok"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "lokomotiv"
path = "src/main.rs"
required-features = ["cli"]

# Spawned by tests/backend_public_api.rs. Rust tests share one process's
# stdout/stderr across parallel threads, so proving the library is silent needs
# a separate process whose streams the test can capture in isolation.
#
# This binary requires `test-support` so end users cannot install it by default.
# It will still be packaged in the .crate archive (Cargo includes all source
# files), but that is harmless — it is a test helper, not a consumer-facing
# binary. If this becomes a concern, move it to a workspace member crate.
[[bin]]
name = "silence_probe"
path = "src/bin/silence_probe.rs"
required-features = ["test-support"]

[lib]
name = "lokomotiv"
path = "src/lib.rs"

[features]
default = ["cli"]
# Everything the `lok` binaries need and the library does not. Enabled by
# default so `cargo install lokomotiv` keeps working; library consumers opt out
# with `default-features = false` to get a tree with no CLI dependencies.
cli = [
    "dep:indicatif",
    "dep:colored",
    "dep:clap",
    "dep:chrono",
    "dep:dirs",
    "dep:futures",
    "dep:minijinja",
    "dep:sha2",
    "dep:env_logger",
]
bedrock = ["aws-config", "aws-sdk-bedrockruntime"]
test-support = []

[dependencies]
tokio = { version = "1", features = ["full", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
async-trait = "0.1"
anyhow = "1"
humantime = "2.1"
thiserror = "2"
log = "0.4"
reqwest = { version = "0.12", features = ["json"] }
secrecy = "0.10"
regex = "1"
which = "7"
aws-config = { version = "1", optional = true }
aws-sdk-bedrockruntime = { version = "1", optional = true }
rand = "0.8"
tempfile = "3"

# Binary-only. Gated behind the `cli` feature so a library consumer using
# `default-features = false` does not compile them. Verified unused in
# `src/backend/`; see docs/specs/2026-07-31-clo-591-strip-cli.md.
clap = { version = "4", features = ["derive"], optional = true }
indicatif = { version = "0.17", optional = true }
colored = { version = "2", optional = true }
dirs = { version = "5", optional = true }
futures = { version = "0.3", optional = true }
sha2 = { version = "0.10", optional = true }
chrono = { version = "0.4.43", features = ["serde"], optional = true }
minijinja = { version = "2", optional = true }
env_logger = { version = "0.11", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# `default-features = false` matters: Cargo unifies features across the graph,
# so a dev-dependency carrying the default `cli` feature would re-enable it
# during `cargo test --no-default-features` and quietly test the wrong build.
lokomotiv = { path = ".", default-features = false, features = ["test-support"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
