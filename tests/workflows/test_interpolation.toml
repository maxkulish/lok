name = "test-interpolation"
description = "Test variable interpolation between steps"

[[steps]]
name = "step1"
shell = "echo 'hello from step1'"

[[steps]]
name = "step2"
shell = "printf 'step1 said: %s\\n' {{ steps.step1.output | shell_escape }}"
depends_on = ["step1"]

[[steps]]
name = "step3"
shell = "printf 'final: %s\\n' {{ steps.step2.output | shell_escape }}"
depends_on = ["step2"]
