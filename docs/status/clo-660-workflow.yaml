issue_corrections:
  - field: lib target commit
    claim: CLO-660 cites d828890 on 2026-07-26; CLO-654 cites ee28f3c on 2026-07-27.
    reality: >-
      Both hold. d828890 (2026-07-26 23:05 +0200) added [lib] to Cargo.toml; ee28f3c (2026-07-27 00:05 +0200) is
      the PR #61 merge that brought it to main.
    impact: Docs should cite the merge to main (ee28f3c) as when the library surface became releasable.
    found_in_phase: init
  - field: ownership of the published crate
    claim: >-
      The 28 published lokomotiv versions are this project's; CLO-654 says the name "is ours and cannot be
      reclaimed", and CLO-660 sets the real deadline as "the first release carrying a lib target".
    reality: >-
      crates.io lists ducks (Jake Goldsborough, the upstream author) as the sole owner and publisher of every
      version. The last publish (2026-02-08) matches the last upstream commit (f8852fc); this repository's own
      history starts 2026-03-29 (ccb8cca). maxkulish/lok is not a GitHub fork (parent none); ducks/lok was still
      pushed to on 2026-08-08.
    impact: >-
      This project cannot publish lokomotiv without a co-owner invite or name transfer from ducks, so a library
      release needs either that or a new crate name. The ticket's corrected premise is itself wrong, and the
      workspace-split cost comparison changes because a rename is on the table either way.
    found_in_phase: spec
  - field: location of the pre-publish phrase
    claim: docs/PROJECT.md carries CLO-609's "pre-publish metadata deadline".
    reality: The phrase is at docs/DEPENDENCIES.md:31; PROJECT.md's CLO-609 row does not contain it.
    impact: None beyond pointing the edit at the right file.
    found_in_phase: spec
  - field: consumer-facing docs
    claim: The ticket scopes the defect to planning docs in docs/.
    reality: >-
      README.md:25 claims lokomotiv is published on crates.io as a library crate, and README.md:31 plus
      src/lib.rs:15 pin version "20260603", which does not exist. ADR clo-589:152 uses "lokomotiv is published to
      crates.io" as a future revisit trigger.
    impact: The inverse false premise reaches consumers directly; outside the four living docs the user scoped.
    found_in_phase: spec
