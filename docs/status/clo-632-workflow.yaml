decisions:
  boundary: >-
    Reject if changed. A project-layer ./lok.toml may repeat a gated value that the built-in defaults plus the user
    config already resolved. A value that differs, or a gated key on a backend absent from the lower layers, is a
    hard load error naming the key and the file. User config and --config stay fully trusted.
  gated_keys:
    - backends.*.command
    - backends.*.args
    - backends.*.api_key_env
    - defaults.command_wrapper
  gated_keys_reason: >-
    There is no `endpoint` key: the Ollama URL is stored in `command`, so gating `command` covers both the execution
    and the exfiltration case. `args` can hand a trusted binary a sandbox-bypass flag. `api_key_env` selects which
    secret is sent. `command_wrapper` wraps the shell steps of the user's own workflows when they run inside the repo.
  lok_toml_consequence: >-
    The repo's own ./lok.toml sets codex args with -c model_reasoning_effort="high", which the default args do not
    include. The same PR removes that arg and documents setting it in ~/.config/lok/lok.toml instead.
  revision_2026_09_15: >-
    After spec review N2 the user chose "user value wins": the allowed-value check is unchanged (built-in default or
    user-resolved value), but gated keys are stripped from the project overlay before the merge, so a project can
    restate a gated value and never change it.
  decided_at: '2026-09-14T20:20:00.000Z'
