pre_decisions:
  error_shape:
    chosen: TemplateSyntax + TemplateRender variants, classified on minijinja::ErrorKind
    detail: >-
      SyntaxError -> TemplateSyntax, UndefinedError -> UnknownVariable, every other kind -> TemplateRender.
      TemplateError::ParseError was rejected as the classifier because from_minijinja also routes render-time
      InvalidOperation errors that carry a line into it, so it would label type errors as syntax errors.
    decided_at: '2026-09-14T12:30:00.000Z'
    decided_by: user
  unclosed_comment_hint:
    chosen: name the unclosed {# line and text, with a ${#VAR} note when preceded by $
    detail: >-
      MiniJinja reports "unexpected end of comment" at end-of-input (line 6 for a body whose ${#OUT} is on line 3),
      so the parser line alone does not locate the fault.
    decided_at: '2026-09-14T12:30:00.000Z'
    decided_by: user
  full_variable_name:
    chosen: fix in this change
    detail: >-
      MiniJinja's undefined-attribute range starts at the failing attribute, so today the message reads
      '{{ .missing.output }}'. Extend the range back to the root identifier.
    decided_at: '2026-09-14T12:30:00.000Z'
    decided_by: user
issue_corrections:
  - field: fallback trigger
    claim: source_range() yields nothing for a comment or block syntax error.
    reality: >-
      MiniJinja 2.19 does return a range for the unclosed-comment SyntaxError, but it points at end-of-input: past
      the template length (template.get returns None) or a lone newline that trims to empty. Other syntax errors
      ({% endfor %}, {{ }}) return in-bounds ranges, so they blame a token such as 'endfor' or '}}' as the unknown
      variable rather than taking the first-{{ }} fallback.
    impact: Deleting the fallback alone would not fix those cases; classification on ErrorKind is required.
    found_in_phase: spec
  - field: scope of the misreport
    claim: The ticket frames the defect around syntax errors.
    reality: >-
      Render-time UnknownFilter and InvalidOperation errors are misreported as UnknownVariable too, and genuine
      undefined attributes are named without their root identifier.
    impact: Covered by the TemplateRender variant and the full-identifier fix.
    found_in_phase: spec
