task_id: clo-600
task_type: specification
classification_reason: >-
  Scope is confined to CI configuration plus one Linux-only test failure. No architecture decisions
  are open: the root cause named in the Linear description (Actions never dispatching) was already
  resolved on 2026-07-27 when Actions was activated in the repo's Actions tab, and gcm's workflows
  supply the target shape. Well-scoped, single-area, M size -> specification workflow.
