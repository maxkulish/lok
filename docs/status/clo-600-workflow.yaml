entry_findings:
  root_cause_status: >-
    Already resolved before this workflow started. Actions dispatched for the first time on
    2026-07-27 after activation in the GitHub Actions tab; the repo now has 6 repo-owned runs
    (ids 30222596040 .. 30223254125). Acceptance criteria 1, 2 and 4 are therefore already met
    by history: pushes to main and pull_request events both produce CI runs.
  remaining_gaps:
    - >-
      main is red: run 30223254125 failed on backend::gemini::tests::gemini_health_check_version_timeout
      (src/backend/gemini.rs:1278) - diagnostic did not contain "timed out" on the Linux runner.
    - >-
      No required check: `gh api repos/maxkulish/lok/branches/main/protection` returns 404 and
      `gh api repos/maxkulish/lok/rulesets` returns []. Acceptance criterion 3 is unmet.
    - >-
      Workflows are thinner than gcm's reference: single-OS, no --locked, no bedrock-feature build,
      linux-gnu-only release target, softprops/action-gh-release@v1, no checksums, no tag-vs-version
      assertion, publish.yml has no dry-run gate.
scope_decisions:
  workflows_in_scope: [ci.yml, release.yml, publish.yml]
  workflow_reference: ~/Code/gcm/.github/workflows/
  red_main: fix in this task
  branch_protection: configure via gh once CI is green
phases:
  discovery:
    status: skipped
    skip_reason: Specification task
    approved: true
  design:
    status: skipped
    reason: Specification task - using /spec instead
  spec:
    status: complete
    spec_file: specs/2026-07-31-clo-600-ci-gate.md
    spec_revision: 2
    approved: true
    review_gemini: docs/reviews/clo-600-spec-review-gemini.md
    review_ollama: docs/reviews/clo-600-spec-review-ollama.md
    review_synthesis: docs/reviews/clo-600-spec-review-synthesis.md
    review_verdict: REVISE
    review_external: >-
      A second, external review moved the verdict from APPROVE_WITH_SUGGESTIONS to REVISE with
      4 blocking findings and 6 high-priority gaps. All 4 blockers were validated against the
      tree at fad3e91 and confirmed. Spec rewritten as rev 2.
    review_completed: true
    review_applied: true
    review_notes: >-
      Gemini returned APPROVE_WITH_SUGGESTIONS. Ollama (Codex via glm-5:cloud) returned
      REVIEW_FAILED with empty stdout, so the verdict rests on a single reviewer. Gemini's
      top-ranked item (swap macos-15-intel for macos-13) was wrong on a checkable fact -
      macos-13 is retired - and was rejected.
    applied_suggestions:
      - >-
        Sub-task 2 now prefers extending the existing acquire_test_lock() to the five probe
        tests that lack it, and only falls back to changing write_exec_script if the stress
        run still reproduces under the lock.
      - AC-5 pins `cargo build --release --locked --target <triple>` so the release compile cannot drift from Cargo.lock.
      - AC-8 records that --dry-run does not authenticate and the token check is a presence assertion only.
      - AC-5 and sub-task 5 specify one archive per target carrying both binaries plus LICENSE.
      - Sub-tasks 5 and 6 pin explicit token permissions (read on build/publish, write only on release assembly).
      - >-
        Added an assumptions-to-verify block for ubuntu-24.04-arm availability and the
        August 2027 x86_64 macOS runner sunset.
    flagged_suggestions:
      - >-
        REJECTED - Gemini's priority-1 item asked to replace macos-15-intel with macos-13.
        Verified against actions/runner-images README: macos-13 is absent (retired),
        macos-15-intel is current. Kept as written; the external review independently agreed.
      - >-
        REVERSED - Gemini's "extend acquire_test_lock instead of changing write_exec_script"
        was applied in rev 1 and reversed in rev 2. The external review showed the lock
        inventory was stale (gemini success DOES hold it; codex holds none; mod.rs:542 is an
        unguarded sync test; claude.rs:491 uses a separate PATH_LOCK that cannot interoperate
        with TEST_MUTEX). Serialisation is containment that decays with every new subprocess
        test, so rev 2 prefers removing the race in the helper and keeps the lock sweep as a
        documented fallback.
    external_review_findings_applied:
      - >-
        BLOCKER 1 - branch-protection ordering was circular (main cannot be green on the new
        workflow before merge, yet the same PR had to prove the gate). Rev 2 splits it into
        AC-14 (ruleset exists and is verified via /rulesets/{id}), AC-15 (gate observed
        blocking this PR), AC-16 (post-merge push run on main is green) with an explicit
        enable-mid-PR sequence in sub-task 8.
      - >-
        BLOCKER 2 - stale ETXTBSY inventory and unprovable stress strategy. Rev 2 carries a
        verified site table, requires the FULL unit suite for the stress run (filtering would
        exclude the competing spawners that create the race), adds a deterministic Linux-only
        regression test as AC-3, and drops the impossible "no write descriptor at any point"
        phrasing for "not in the calling process".
      - >-
        BLOCKER 3 - sub-task 6 ended with "then the real publish" while the constraints forbade
        publishing. Rev 2 removes the real publish step entirely and records that CARGO_TOKEN
        is not the variable cargo reads automatically (CARGO_REGISTRY_TOKEN is).
      - >-
        BLOCKER 4 - verification commands omitted --ref and would have rehearsed main's old
        workflows. Rev 2 adds --ref, moves the publish test post-merge (publish.yml has no
        workflow_dispatch on main so it cannot be dispatched pre-merge), gates the stress job
        on a PR label rather than dispatch for the same reason, and names it outside CI Gate's
        needs so it cannot satisfy the required context.
      - >-
        GAP 5 - required check is now a single non-matrix aggregator job (CI Gate) and the
        ruleset is verified by reading rule parameters, not the list summary.
      - >-
        GAP 6 - tag validation moved from gcm's loose `case v[0-9]*` to a strict regex plus
        existence, reachability-from-main and prerelease/make_latest handling.
      - >-
        GAP 7 - release integrity: manual rehearsals now produce a draft that is deleted after
        inspection, so a rehearsal cannot mutate a public release. Mutable re-runs on real tags
        are accepted explicitly with the checksum-vs-provenance tradeoff stated; attestations
        recorded as follow-up.
      - >-
        GAP 8 - Linux release builds pinned to ubuntu-22.04 / ubuntu-22.04-arm to declare a
        glibc floor (2.35), with a GLIBC-symbol check and recorded libssl dependencies.
      - >-
        GAP 9 - --locked now covers clippy, the CI release build and the publish dry run;
        bedrock is linted and tested rather than only compiled.
      - >-
        GAP 10 - Cargo.toml still pointing repository/homepage at ducks/lok is recorded as
        out-of-scope follow-up, since no real publish happens in this task.
      - >-
        SMALL - AC-8 now escalates rather than silently dropping the ARM target; action
        pinning policy made explicit (drop dtolnay/rust-toolchain, SHA-pin action-gh-release,
        keep first-party actions on major tags); action-gh-release corrected from the stale
        @v2 to v3.0.2 (SHA 3d0d9888cb7fd7b750713d6e236d1fcb99157228, node24 - which also
        clears the Node 20 deprecation warnings in lok's current runs); header counts fixed to
        7 files / 8 sub-tasks.
  implement:
    status: in_progress
    subtasks:
      1_instrument_assertions: complete
      2_deterministic_repro: complete
      3_fix_write_exec_script: complete
      4_ci_yml: complete
      5_stress_job: complete
      6_release_yml: complete
      7_publish_yml: complete
      8_branch_protection: complete
    evidence:
      cause_established: >-
        Control experiment on throwaway branch tmp/clo-600-prefix-control (run 30667858179)
        restored the pre-fix write_exec_script and lost the stress job on the first iteration:
        "iteration 16 failed to spawn: Os { code: 26, kind: ExecutableFileBusy, message: \"Text
        file busy\" }" at src/backend/mod.rs:669. The same job passes 20/20 with the fix
        (run 30667318307). ETXTBSY is therefore the demonstrated cause, not a hypothesis.
      mechanism_test: >-
        etxtbsy_is_reachable_when_a_child_inherits_the_write_descriptor passes on ubuntu-latest,
        confirming execve does fail with ETXTBSY there when a child holds a duplicated write
        descriptor past its own exec.
      ci_runs:
        - 30667312066 (pull_request, CI Gate success, stress skipped - no label yet)
        - 30667318307 (labeled, CI Gate success, etxtbsy-stress success 20/20)
        - 30667858179 (control, pre-fix helper, etxtbsy-stress FAILED as designed; canceled after capture)
      ruleset_id: 20153405
      ruleset_verified: >-
        GET /repos/maxkulish/lok/rulesets/20153405 - enforcement active, target branch,
        refs/heads/main, bypass_actors empty, required_status_checks [{context "CI Gate",
        integration_id 15368}], strict_required_status_checks_policy true, plus deletion and
        non_fast_forward rules.
      caveat: >-
        The captured errno came from write_exec_script's own fork-storm test, not from a fresh
        reproduction inside gemini_health_check_version_timeout. Same helper, same code path,
        same errno as the eight failures in run 30222596040, but the production-path diagnostic
        string was not re-captured post-instrumentation.
  pr:
    status: in_progress
    pr_url: https://github.com/maxkulish/lok/pull/64
    pr_number: 64
  complete:
