  findings:
    - id: V1
      claim_in_issue: colored reaches the library only through retry.rs
      actual: >-
        Two library call sites. src/backend/retry.rs:102 writes the retry warning, and src/backend/mod.rs:440 in
        resolve_health_cache_ttl writes a TTL parse warning. Both use colored::Colorize and eprintln!.
      evidence:
        - src/backend/retry.rs:3
        - src/backend/retry.rs:102
        - src/backend/mod.rs:28
        - src/backend/mod.rs:440
    - id: V2
      claim_in_issue: not mentioned
      actual: >-
        src/backend/codex.rs:147 and src/backend/gemini.rs:505 emit an identical sandbox downgrade warning through
        println! to stdout on a consumer-reachable path (resolve_effective_sandbox, called during query setup). stdout
        is a worse target for a library than the stderr the acceptance criteria call out.
      evidence:
        - src/backend/codex.rs:147
        - src/backend/gemini.rs:505
    - id: V3
      claim_in_issue: not mentioned
      actual: >-
        indicatif code is already confined to the binary side (src/engine.rs:14, :270, :282 are the only uses), but
        Cargo.toml declares indicatif and colored as unconditional dependencies. Acceptance criterion 1 (cargo tree with
        default features shows no indicatif) therefore cannot be satisfied by moving code alone; the binary-only
        dependencies need feature gating with default = [], which changes how the lok/lokomotiv binaries are built.
      evidence:
        - Cargo.toml:37-39
        - Cargo.toml:48-49
        - src/engine.rs:14
    - id: V4
      claim_in_issue: not mentioned
      actual: >-
        src/backend/claude.rs:445, :449 and :464 emit unconditional diagnostic eprintln! from the health probe path.
        Not colored, but still library bytes on a consumer stderr.
      evidence:
        - src/backend/claude.rs:445
        - src/backend/claude.rs:449
        - src/backend/claude.rs:464
open_decisions:
  - id: D1
    topic: Cargo feature layout for binary-only dependencies
    resolution: >-
      Single package with feature gating. default = ["cli"], consumers opt out with default-features = false, both
      [[bin]] targets get required-features = ["cli"]. The workspace split (lokomotiv-core lib plus lokomotiv bins) was
      recommended and declined by the user in favour of keeping CLO-591 tight.
    consequences: >-
      The Linear acceptance criterion "cargo tree ... with default features shows no indicatif" cannot hold literally;
      amended to default-features = false and to be called out in the PR body. The boundary stays convention-based
      rather than compiler-enforced, which is the same condition that produced the six divergences; flagged for
      CLO-592.
    status: resolved
  - id: D2
    topic: BACKEND_CACHE global semantics
    resolution: >-
      Deferred with reason. Verification showed both fixes the issue proposes are blocked. CachedBackend
      (src/backend/mod.rs:346) deliberately unifies the backend instance with its health status, and
      is_backend_available (src/backend/mod.rs:457) looks entries up by name alone from inside the providers' own
      is_available() impls. Keying by name+config-hash breaks that lookup because it has no config to hash; moving the
      cache to the binary breaks the library's own is_available(). Either fix needs is_available rearchitected, which
      is larger than stripping presentation. Document the constraint in rustdoc, record in the ADR, raise a follow-up
      against CLO-592.
    status: deferred
  - id: D3
    topic: Retry and warning logging mechanism
    resolution: >-
      log facade. log::warn! for retry.rs:102, mod.rs:440, codex.rs:147 and gemini.rs:505; log::debug! for the
      claude.rs probe diagnostics. Silent unless a consumer installs a logger, so the no-bytes-on-stderr criterion
      holds structurally. Binary adds env_logger under the cli feature to keep warnings visible. tracing rejected as
      more machinery than four sites justify; structured-return rejected as signature churn the facade already covers.
    status: resolved
