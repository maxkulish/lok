pre_decisions:
  cache_shape:
    chosen: config-hash key in the process-global cache
    detail: >-
      Key BACKEND_CACHE on (name, hash-of-effective-BackendConfig) rather than name alone. Providers thread their own
      cache-key identity into is_available instead of passing a bare name. Rejected alternative: a host-owned
      BackendCache handle, which is the better long-term library shape but a breaking public API change touching all
      16 create_backend call sites.
    decided_at: '2026-08-07T08:10:25.000Z'
    decided_by: user
    revisit_in_phase: design
  cache_key_content:
    chosen: owned BackendKey { name, config, retry } with derived PartialEq + Eq + Hash
    detail: >-
      Key on the values themselves rather than a u64 digest. Removes the collision surface entirely, where a collision
      would reproduce the exact silent-wrong-instance bug being fixed, and removes the hash-stability question the
      issue raised (moot anyway - the cache is in-memory, so cross-run stability is not a requirement). Includes
      RetryPolicy because create_backend wraps in RetryExecutor based on it and it is derived from config.defaults,
      which is not part of BackendConfig. Cost is one BackendConfig clone per entry at roughly 16 entries.
    decided_at: '2026-08-07T08:20:00.000Z'
    decided_by: user
issue_corrections:
  - field: is_backend_available call sites
    claim: 'Issue cites src/engine.rs:178 pub fn is_backend_available as a second production call site.'
    reality: >-
      That function is #[cfg(test)]-gated (src/engine.rs:177-178), so it is a test-only helper. The single production
      path is src/backend/mod.rs:564 (pub(crate)), called from five provider is_available impls: ollama.rs:180,
      bedrock.rs:233, codex.rs:350, claude.rs:324, gemini.rs:820.
    impact: >-
      Acceptance criterion "is_backend_available reports on the same identity the cache keys on, at both call sites"
      resolves to one production site plus one test helper, not two production sites.
    found_in_phase: init
  - field: name-keyed cache access surface
    claim: The issue frames the rework as touching is_backend_available at two call sites.
    reality: >-
      Eight production sites read or write the cache by name - backend/mod.rs:367 (create_backend read),
      backend/mod.rs:405 (create_backend insert), backend/mod.rs:570 (is_backend_available, reached from five provider
      impls), engine.rs:100 (warmup skip-check), engine.rs:161 (warmup write-back), engine.rs:199 (get_cached_health,
      public, called from main.rs:795), workflow.rs:107 (health lookup) and workflow.rs:224 (hardcoded
      lock.get("ollama") with no config in scope).
    impact: >-
      get_cached_health is public API, so the config-hash option is not fully non-breaking as assumed at init.
      workflow.rs:224 has no config available and needs one threaded in or a different lookup.
    found_in_phase: discovery
  - field: provider config retention
    claim: Providers can identify themselves to the cache the way the cache keys them.
    reality: >-
      Providers retain derived fields only - OllamaBackend is { client, base_url, model }. None keeps its
      BackendConfig, so is_available cannot compute or reconstruct a key. Each provider struct must carry a key field
      populated at construction.
    impact: Every provider struct and constructor changes, not just the shared helper.
    found_in_phase: discovery
  - field: warmup write-back keying
    claim: Health probing is orthogonal to the cache key.
    reality: >-
      warmup_backends reads at engine.rs:100 using the config map key but writes back at engine.rs:161 using
      backend.name(). The two are identical under name keying and diverge under config keying, which would make warmup
      insert a second entry that is_available never reads.
    impact: >-
      This is the concrete mechanism by which a naive fix silently breaks the health-probe layer the issue asks to
      preserve. It is the highest-risk site in the change.
    found_in_phase: discovery
  - field: RetryPolicy in the cache key
    claim: 'Issue proposes "a hash of the effective BackendConfig" as the cache key.'
    reality: >-
      create_backend also takes RetryPolicy, derived by get_retry_policy(backend_config, &config.defaults). Two
      consumers with identical BackendConfig but different defaults.max_retries get differently-wrapped RetryExecutor
      instances that a BackendConfig-only key still collides.
    impact: Key must include RetryPolicy or the ticket's own acceptance criterion stays partly unmet.
    found_in_phase: discovery
