  branch_note: >-
    A branch `feat/clo-633-slice-panics` already existed locally, clean and with no commits ahead of
    main. Renamed to `fix/clo-633-slice-panics` at entry to match the convention that the branch
    type mirrors the conventional commit type; this task ships `fix:` commits. Never pushed, so the
    rename cost nothing.
  defects_verified_at_entry: >-
    All four sites read and confirmed against the working tree before writing the spec. The line
    numbers in the Linear description have drifted slightly; the actual locations are recorded
    below.
  sites:
    - 'src/tasks/ci.rs:196 - GitHub `--log-failed` path. `&log_text[log_text.len() - 15000..]` on a byte offset. Confirmed.'
    - 'src/tasks/ci.rs:273 - GitLab `ci trace` path. Same byte-offset slice, different truncation suffix. Confirmed.'
    - 'src/tasks/context.rs:329-333 - `read_file_around_line`. `start` clamped only at 0, `end` only at `lines.len()`; `line + context_lines` unguarded. Confirmed.'
    - 'src/tasks/fix.rs:189-198 - inline near-duplicate of the same logic with `context_lines` hardcoded to 10. Confirmed.'
  duplication: >-
    `src/tasks/fix.rs` does not call `read_file_around_line`; it inlines the same start/end/marker
    loop with a hardcoded window of 10. The two copies differ in output framing (fix.rs wraps in a
    fenced block and prints a `### path (around line N)` heading), so a shared helper has to return
    the numbered-line body only and leave framing to each caller.
