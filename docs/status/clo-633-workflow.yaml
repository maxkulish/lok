task_id: clo-633
task_type: specification
classification_reason: >-
  The Linear description already fixes the shape of every change: four named slicing sites, the
  defect mechanism for each, the prescribed fix for each (`floor_char_boundary`/`char_indices`,
  clamp `start` to `end`, `saturating_add`), and four acceptance criteria. No architecture decision
  is open. The one judgement left - whether to extract the duplicated `read_file_around_line` into
  a shared helper - is a local refactor question the spec can settle, not a design-doc question.
  Three files, one module (`src/tasks/`), S size -> specification workflow.
